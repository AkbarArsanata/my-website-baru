<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Section</title>
  <link rel="stylesheet" href="hero.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  
  <section class="hero">
    <div class="hero-content">
      <p class="greeting">👋 Hi, I'm Akbar</p>

      <h1 class="hero-title">Data • AI • Statistics</h1>

      <p class="hero-subtitle">
        Turning data into insights & building intelligent solutions with Machine Learning & AI.
      </p>

      <!-- Horizontal Buttons -->
      <div class="hero-buttons">
        <a href="#projects" class="btn">🚀 Work</a>
        <a href="#certificates" class="btn">📜 Certificates</a>
        <a href="#about" class="btn">👤 Profile</a>
        <a href="#experience-section" class="btn">💼 Experience</a>
        <a href="#contact" class="btn">💬 Contact</a>
      </div>
    </div>
  </section>

  <!-- Back to top -->
  <button id="backToTop"><i class="fas fa-arrow-up"></i></button>

  <script>
    const backToTop = document.getElementById("backToTop");
    window.addEventListener("scroll", () => {
      backToTop.style.display = window.scrollY > 300 ? "block" : "none";
    });
    backToTop.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
</body>
</html>
